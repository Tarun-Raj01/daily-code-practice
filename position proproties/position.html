<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 200vh;
        }
        .hi{
            background-color: blueviolet;
            border: 5px solid black;
            width: 200px;
            height: 200px;
            position: sticky;
            top: 0px;

        }
              .bye{
            background-color: red;
            border: 5px solid black;
            width: 200px;
            height: 200px;
            /* position: relative;
            /* top: 70px; */
            /* left: 500px;
            bottom: 50px; */ 
            position: absolute;
            left: 130px;
            top: 100px;
            border-radius:10px 20px 30px 40px;
            border-top-left-radius: 10px;

        }
              .come{
            background-color: green;
            border: 5px solid black;
            width: 200px;
            height: 200px;
            

        }
        section{
            height: 400px;
            width: 500px;
            background-color: yellow;
            position: relative;
            border: 3px solid black;
            
        }

        
    </style>
    <!-- static  realtive absolute fixed sticky <b>helping proprities 1 left right top bottom</b>  -->
     <div class="hi">
        box 1
     </div>
     <section>
         <div class="bye">
        box 2
     </div>
     </section>
    
     <div class="come"> box 3</div>

</body>
</html>
