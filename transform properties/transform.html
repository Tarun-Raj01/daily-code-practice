<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .a {
            width: 200px;
            height: 200px;
            background-color: red;
            transition: transform 1.5s ease-in-out;
            display: flex;
            z-index: 1;
        }

        .a:hover {
            background-color: blue;
            transform: translate(45px, 45px) rotate(360deg);
        }
        .b {
            width: 200px;
            height: 200px;
            background-color: green;
            transition: transform 1.5s ease-in-out;
            display: flex;
            margin-top: 20px;
        }
        .b:hover {
            background-color: purple;
            transform: translate(45px, 45px) rotate(360deg);
        }
        .c {
            width: 50px;
            height: 50px;
            background-color: yellow;
            margin: auto;
            transition: transform 1.5s ease-in-out;
            border-radius: 50%;
            z-index: 1;
        }
        .c:hover {
            transform: scale(1.5);
        }
    </style>
    <div class="a">
        <div class="c"></div>
    </div>
    <div class="b"></div>
</body>

</html>
