<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .silders{
            height: 200px;
            width:100%;
            border: 2px solid black;
            overflow: hidden;
        }
        .slid{
            height: 100%;
            width: 500%;
            display: flex;
        }
            /* overflow: hidden; */
            /* animation-name: slide; */
            /* animation-duration: 15s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            overflow: hidden;
            animation-delay: 3s;
        } */
        .slide{
            height: 100%;
            width: 20%;
             animation-name: slide;
            animation-duration: 15s;
            animation-iteration-count: 1;
            animation-timing-function: ease-in-out;
            /* overflow: hidden; */
            animation-delay: 3s;
        }
        .img1{
            background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c2xpZGV8ZW58MHx8MHx8fDA%3D&w=1000&q=80");
            background-size: cover;
        }
        .img2{
            background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8c2xpZGV8ZW58MHx8MHx8fDA%3D&w=1000&q=80");
            background-size: cover;
        }
        .img3{
            background-image: url("https://images.unsplash.com/photo-1494526585095-c41746248156?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8c2xpZGV8ZW58MHx8MHx8fDA%3D&w=1000&q=80");
            background-size: cover;
        }
        .img4{
            background-image: url("https://images.unsplash.com/photo-1500534623283-312aade485b7?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8c2xpZGV8ZW58MHx8MHx8fDA%3D&w=1000&q=80");
            background-size: cover;
        }
        .img5{
            background-image: url("https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8c2xpZGV8ZW58MHx8MHx8fDA%3D&w=1000&q=80");
            background-size: cover;
        }
        @keyframes slide {
            0%{
                transform: translateX(0%);
            }
            20%{
                transform: translateX(0%);
            }
            25%{
                transform: translateX(-100%);
            }
            40%{
                transform: translateX(-100%);
            }
            45%{
                transform: translateX(-200%);
            }
            60%{
                transform: translateX(-200%);
            }
            65%{
                transform: translateX(-300%);
            }
            80%{
                transform: translateX(-300%);
            }
            85%{
                transform: translateX(-400%)
            }
            100%{
                transform: translateX(-400%)
            }


            
        }
    </style>
    <div class="silders">
        <div class="slid">
        <div class="slide img1"></div>
        <div class="slide img2"></div>
        <div class="slide img3"></div>
        <div class="slide img4"></div>
        <div class="slide img5"></div>
        </div>
        
    </div>
    
</body>
</html>
