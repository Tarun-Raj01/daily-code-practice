<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset style="width: 450px; background-color: lightcoral; border: 5px solid black;">
        <legend style="background-color: lightgreen;">Registration Form</legend>
        <form action="https://www.flipkart.com" target="_blank" style="background-color: lightblue;" autocomplete="off" method="post">
            <table cellspacing="10">
                <tr>
                    <td><label for="username">username</label></td>

                    <td><input type="text" name="username" id="username" required></td>
                </tr>
                <tr>
                    <td><label for="password">password</label></td>
                    <td><input type="password" name="password" id="password" required pattern="[A-Z]{1}[0-9][2]"></td>
                </tr>
                <tr>
                    <td><label for="email">email</label></td>
                    <td><input type="email" name="email" id="email"  title="one upper letter 2 small letter"></td>
                    
                </tr>
                <tr>
                    <td><label for="gender">gender</label></td>
                    <td>
                        <input type="radio" name="gender" id="male" value="male">
                        <label for="male">male</label>
                        <input type="radio" name="gender" id="female" value="female">
                        <label for="female">female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="date">date</label></td>
                    <td><input type="date" name="date" id="date"></td>
                </tr>
                <tr>
                    <td><label for="address">address</label></td>
                    <td><textarea name="address" id="address" cols="30" rows="5"></textarea></td>
                </tr>
                <tr>
                    <td><label for="city">city</label></td>
                    <td><input type="text" name="city" id="city" maxlength="50"></td>
                </tr>
                <tr>
                    <td><label for="pincode">pincode</label></td>
                    <td><input type="text" name="pincode" id="pincode" maxlength="6"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="submit"></td>
                </tr>
                <tr>
                    <td> <label for="engineering">Engineering</label></td>
                    <td><select name="engineering" id="engineering">
                        <optgroup label="branches">
                        <option value="" hidden>select branch</option>
                        <option value="cs">Computer Science</option>
                        <option value="it">Information Technology</option>
                        <option value="mech">Mechanical Engineering</option></optgroup>
                        
                        <ol>
                            <li>Computer Science</li>
                            <li>Information Technology</li>
                        </ol>

                    </select></td>
                </tr>
            </table>
            <video src=""></video>
            <button type="reset" autofocus>Reset</button>
                <ol type="A" start="3">
                            <li>Computer Science</li>
                            <li>Information Technology</li>
                            <ul type="square">
                                <li>Software Engineering</li>
                                <li>Data Science</li>
                            </ul>
                        </ol>
        </form>


    </fieldset>
    

    
</body>
</html>
