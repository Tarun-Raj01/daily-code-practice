<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <fieldset style="width: 450px; background-color: lightcoral;">
        <center>
    
    <h1 style="background-color: lightcoral;"><marquee behavior="scroll" direction="right">Personal Information</marquee></h1>

    <form action="https://www.flipkart.com"  method="post"  style="background-color:  lightgreen;">
    
    <table cellspacing="10" cellpadding="5">
        <tr>
            <td><label for="Name">my name is--</label></td>
            <td><br><input type="text" name="name" id="Name" placeholder="enter your name" maxlength="10" minlength="4"><br>full name</td>
            
        </tr>
        <tr>
            <td><label for="passward">Enter your passward</label></td>
            <td><input type="password" name="passward" id="passward" required placeholder="enter your password" maxlength="10" minlength="4" ></td>
        </tr>
       
        <tr>
            <td><label for="email">Enter your valid email</label></td>
            <td><input type="email" name="email" id="email" placeholder="Enter your valid email"></td>
        </tr>
        <tr>
            <td><label for="gender">gender</label></td>
            <td><input type="radio" name="gender" id="gender">male
            <input type="radio" name="gender" id="gender">female</td>
        </tr>
        <tr>
            <td><label for="text">Degree</label></td>
            <td><select name="Degree" id="text">
                <option value="" hidden>select here</option>
                <option value="BE">BE</option>
                <option value="DIPLOMA">DIPLOMA</option>
                <option value="ARTS">ARTS</option>

            </select></td>
        </tr>
        <tr>
            <td><label for="contact">contact</label></td>
            <td><textarea name="contact" id="contact"></textarea></td>
        </tr>
        <tr>
            <td><label for="Engineering">Engineering</label></td>
            <td><select name="Engineering" id="Engineerin">
                <option value="" hidden>select branch</option>
                <option value="cs">cs</option>
                <option value="ec">ec</option>
                <option value="is">is</option>
                <option value="ai/ml">ai/ml</option>
            </select></td>
        </tr>
        <tr>
            <td><label for="hobies"> hobies</label></td>
            <td><input type="radio" name="hoobies" id="hobies">playing chess
            <input type="radio" name="hoobies" id="hobies">reeding books</td>
        </tr>
        <tr>
            <td colspan="2" align="center"> <button type="submit">register</button></td>
        </tr>
        
        
    </table>
    </form>
    </center>
    </fieldset>
    </center>
    


    

</body>
</html>
